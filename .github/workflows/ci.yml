name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Check JavaScript and shell syntax
        run: |
          for file in src/*.js scripts/*.cjs tests/*.cjs; do
            node --check "$file"
          done
          bash -n scripts/package-macos.sh
